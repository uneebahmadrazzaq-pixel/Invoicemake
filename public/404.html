<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening Invoice Tool</title>
    <script>
      (() => {
        const isGitHubPages = location.hostname.endsWith(".github.io");
        const projectRoot = isGitHubPages ? "/Invoicemake" : "";
        const target = new URL(`${projectRoot}/editor/index.html`, location.origin);
        target.searchParams.set("v", "20260910-stable-sign-in-redirect");
        if (/\/sign-?in(?:\/|$)/i.test(location.pathname)) target.searchParams.set("auth", "signIn");
        if (/\/sign-?up(?:\/|$)/i.test(location.pathname)) target.searchParams.set("auth", "signUp");
        location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <p>Opening Invoice Tool…</p>
  </body>
</html>
